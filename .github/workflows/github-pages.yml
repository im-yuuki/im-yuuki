name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - ".vitepress/**"
      - "docs/**"
      - "work/**"
      - "assets/**"
      - "public/**"
      - "index.md"
      - "README.md"
      - "CNAME"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - ".github/workflows/github-pages.yml"
  pull_request:
    branches: [main, master]
    paths:
      - ".vitepress/**"
      - "docs/**"
      - "work/**"
      - "assets/**"
      - "public/**"
      - "index.md"
      - "README.md"
      - "CNAME"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.mjs"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
